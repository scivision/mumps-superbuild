name: ci

env:
  HOMEBREW_NO_INSTALL_CLEANUP: 1

on:
  push:
    paths:
      - "**.c"
      - "**.f"
      - "**.F"
      - "**.f90"
      - "**.F90"
      - "**.cmake"
      - "**/CMakeLists.txt"
      - "cmake/*.json"
      - ".github/workflows/ci.yml"
      - ".github/actions/**"
      - "!scripts/*"

  workflow_dispatch:
  pull_request:

# avoid wasted runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  core:
    timeout-minutes: 7

    strategy:
      matrix:
        mpich: [false]
        lapack_vendor: [""]
        os: [ubuntu-26.04, ubuntu-24.04, macos-latest]
        include:
          - lapack_vendor: "OpenBLAS"
            os: ubuntu-latest
            name: OpenBLAS
          - lapack_vendor: "Accelerate"
            os: macos-latest
            name: Accelerate
          - mpich: true
            os: ubuntu-latest
            name: MPICH

    name: ${{ matrix.os }}-${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:

    - &checkout
      uses: actions/checkout@v7

    - &prereqs
      name: install prereqs
      timeout-minutes: 5
      # 3 minutes isn't quite enough for multi-stage installs
      uses: ./.github/actions/composite-deps

    - &macos_fortran
      name: set Fortran compiler FC (macOS)
      if: runner.os == 'macOS'
      run: echo "FC=gfortran-15" >> $GITHUB_ENV

    - name: build and install
      uses: ./.github/actions/composite-build

    - name: build example
      uses: ./.github/actions/composite-example

    - name: pkg-config consumer
      uses: ./.github/actions/composite-pkgconfig
      with:
        cc: mpicc


  accelerate-nompi:
    # Accelerate against libseq, which is the sequential path the parallel job above does not cover.
    # int64-nompi covers the $NEWLAPACK$ILP64 linker aliases. It has to stay sequential, because
    # Homebrew's open-mpi has a 4-byte Fortran INTEGER and MUMPS_intsize64 makes MUMPS pass 8-byte
    # ones, so int64 with MPI cannot work on this runner at all (Intel MPI's ILP64 build is the
    # only one handled, see CMakeLists.txt).
    timeout-minutes: 7

    strategy:
      matrix:
        preset: [nompi, int64-nompi]

    name: macos-latest-Accelerate-${{ matrix.preset }}
    runs-on: macos-latest

    steps:
    - *checkout
    - *prereqs
    - *macos_fortran

    - name: configure
      run: cmake --preset ${{ matrix.preset }} -DLAPACK_VENDOR=Accelerate

    - run: cmake --workflow ${{ matrix.preset }}

    - run: cmake --install build

    - name: pkg-config consumer
      uses: ./.github/actions/composite-pkgconfig


  armpl:
    # ArmPL is the vendor BLAS/LAPACK on AArch64 (it's what AWS points to for Graviton).
    # openmp-nompi covers the threaded "_mp" library, which needs an OpenMP runtime added
    # because the library doesn't record that dependency itself.
    # This is also the only Linux ARM64 job, the rest of ARM coverage is macOS.
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
        - preset: nompi
          vendor: ArmPL
        - preset: openmp-nompi
          vendor: ArmPL;OpenMP

    name: ubuntu-24.04-arm-ArmPL-${{ matrix.preset }}
    runs-on: ubuntu-24.04-arm

    steps:
    - *checkout

    - name: install ArmPL
      # Arm's apt repository, so there is no tarball installer or login to drive.
      # The install root is taken from the package file list rather than a guessed path.
      run: |
        curl -LO https://developer.arm.com/packages/arm-toolchains/ubuntu/pool/arm-toolchains-repository_2-2~noble_all.deb
        sudo dpkg -i arm-toolchains-repository_2-2~noble_all.deb
        sudo apt update
        sudo apt install -y arm-performance-libraries
        lib=$(dpkg -L arm-performance-libraries | grep -m1 -E '/libarmpl_lp64\.so$')
        if [ -z "$lib" ]; then
          echo "libarmpl_lp64.so not found in the package, its .so files are:"
          dpkg -L arm-performance-libraries | grep -E '\.so$' | head -20
          exit 1
        fi
        root=$(dirname "$(dirname "$lib")")
        echo "ArmPL root: $root"
        echo "ARMPL_DIR=$root" >> $GITHUB_ENV

    - name: configure
      run: cmake --preset ${{ matrix.preset }} -DLAPACK_VENDOR="${{ matrix.vendor }}"

    - run: cmake --workflow ${{ matrix.preset }}

    - run: cmake --install build

    - name: pkg-config consumer
      uses: ./.github/actions/composite-pkgconfig


  gnu-make:
    # this is important case as due to project complexity, some failures only happen with GNU Make (or Ninja)
    timeout-minutes: 7

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - *checkout
    - *prereqs
    - *macos_fortran

    - name: build and test with GNU Make
      shell: bash
      run: cmake --workflow gmake


  shared:
    timeout-minutes: 7
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - *checkout
    - *prereqs
    - *macos_fortran

    - run: cmake --workflow shared
    - run: cmake --install build-shared

    - name: pkg-config consumer
      uses: ./.github/actions/composite-pkgconfig
      with:
        prefix: build-shared/local
        cc: mpicc

    - name: example workflow
      working-directory: example
      run: cmake --workflow shared

  openmp:
    timeout-minutes: 7
    strategy:
      matrix:
        preset: [openmp-nompi, openmp-mpi]

    runs-on: ubuntu-latest

    steps:
    - *checkout
    - *prereqs

    - run: cmake --workflow ${{ matrix.preset }}

    - run: cmake --install build

    - name: example workflow
      working-directory: example/openmp
      run: cmake --workflow ${{ matrix.preset }}


  scotch-metis:
    timeout-minutes: 7

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [scotch, metis, parmetis]

    runs-on: ${{ matrix.os }}

    steps:
    - *checkout
    - *prereqs
    - *macos_fortran

    - name: Load Homebrew environment (macOS)
      if: runner.os == 'macOS'
      run: |
        eval "$(/opt/homebrew/bin/brew shellenv)"
        printenv >> $GITHUB_ENV
# necessary to find Homebrew Bison to build Scotch on macOS

    - run: cmake --workflow ${{ matrix.preset }}
    - run: cmake --install build-${{ matrix.preset }}

    - name: pkg-config consumer
      uses: ./.github/actions/composite-pkgconfig
      with:
        prefix: build-${{ matrix.preset }}/local
        cc: mpicc

    - name: example workflow
      working-directory: example/${{ matrix.preset }}
      run: cmake --workflow ${{ matrix.preset }}


  cmake-older:
    timeout-minutes: 7

    runs-on: ubuntu-latest

    strategy:
      matrix:
        cmake_version: ["3.26.6"]
        # nompi-scotch is the CMP0077 regression test. On CMake older than 4 Scotch's option()
        # calls used to clear BUILD_PTSCOTCH, so a sequential build went looking for MPI that
        # this job deliberately does not install (composite-deps skips MPI for a "nompi" preset).
        preset: [default, nompi-scotch]

    steps:
    - *checkout
    - *prereqs

    - uses: ./.github/actions/composite-cmake

    - name: configure
      run: $CMAKE --workflow --preset ${{ matrix.preset }}
# syntax needed for older CMake

    - name: install package
      run: $CMAKE --install build


# test this project used as an archive in other projects
  archive:
    timeout-minutes: 7

    runs-on: ubuntu-latest

    steps:
    - *checkout
    - *prereqs

    - name: Test Project as archive
      run: cmake -S example/other_project -B build

# if broken, the CMake configure step fails
